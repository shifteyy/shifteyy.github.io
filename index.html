<style>
  /* Layout: the original dark and blue theme on the Dusk structure.
     Profile on top, a sticky game switch, then sections with their title in a left column. */
  :root {
    --bg: #07080b;
    --surface: #0d0f14;
    --surface2: #13161c;
    --border: #181b22;
    --border2: #252933;
    --accent: #5b8fff;
    --text: #e3e5ea;
    --text2: #8c919c;
    --text3: #646a76;
    --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 8px;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--bg);
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .wrap {
    max-width: 820px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Profile */
  .hero { display: flex; align-items: center; gap: 24px; padding-block: 72px 40px; }
  .avatar { width: 82px; height: 82px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--surface2); }
  .who { min-width: 0; }
  h1 { margin: 0 0 12px; font-family: var(--mono); font-size: 25px; font-weight: 500; letter-spacing: -0.3px; line-height: 1.2; }
  .links { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border2); border-radius: 5px;
    font-family: var(--mono); font-size: 12px; color: var(--text2); text-decoration: none;
    transition: border-color .12s, color .12s;
  }
  .chip:hover, .chip.is-done { border-color: var(--accent); color: var(--accent); }
  .chip svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }

  /* Sticky game switch */
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: rgba(7, 8, 11, 0.86);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .bar-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
  .games { display: flex; gap: 28px; }
  .game {
    position: relative; background: none; border: 0; cursor: pointer;
    padding: 16px 0 13px; font-size: 22px; font-weight: 500; letter-spacing: -0.2px; line-height: 1;
    color: var(--text3); transition: color .15s;
  }
  .game:hover { color: var(--text2); }
  .game[aria-selected="true"] { color: var(--text); }
  .game::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--accent); transform: scaleX(0); transform-origin: left;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  }
  .game[aria-selected="true"]::after { transform: scaleX(1); }
  .jump { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 16px; padding-bottom: 14px; }
  .jump button {
    background: none; border: 0; padding: 0; cursor: pointer;
    font-family: var(--mono); font-size: 11.5px; color: var(--text3);
  }
  .jump button:hover { color: var(--accent); }

  /* Sections */
  .sec {
    display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 24px;
    padding-block: 34px; border-bottom: 1px solid var(--border);
    scroll-margin-top: 64px;
  }
  .sec h2 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.5; }
  .sec-body { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .label {
    margin: 0 0 6px; font-family: var(--mono); font-size: 10.5px; font-weight: 400;
    letter-spacing: 2px; text-transform: uppercase; color: var(--text3);
  }

  /* Mouse */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 24px; margin: 0; }
  .stat { margin: 0; display: grid; gap: 1px; }
  .stat dt { font-size: 12.5px; color: var(--text2); }
  .stat dd { margin: 0; font-family: var(--mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .stat.accent dd { color: var(--accent); }

  /* Rows */
  .rows { margin: 0; display: grid; }
  .rows.two { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding-block: 9px; border-bottom: 1px solid var(--border);
  }
  .row dt { font-size: 13.5px; color: var(--text2); min-width: 0; }
  .row dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }

  /* Crosshairs: pick one, its code shows in the bar */
  .xh-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .xh-tiles { display: flex; gap: 6px; }
  .xh-tile {
    position: relative; width: 44px; height: 44px; padding: 0; overflow: hidden; cursor: pointer;
    background: #000; border: 1px solid var(--border2); border-radius: 6px;
    transition: border-color .12s;
  }
  .xh-tile canvas { width: 100%; height: 100%; display: block; }
  .xh-tile .n { position: absolute; top: 3px; left: 5px; font-family: var(--mono); font-size: 9px; line-height: 1; color: var(--text3); }
  .xh-tile:hover { border-color: var(--text3); }
  .xh-tile[aria-checked="true"] { border-color: var(--accent); }
  .xh-tile[aria-checked="true"] .n { color: var(--accent); }
  .xh-bar {
    flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
    padding: 5px 5px 5px 12px; min-height: 44px;
  }
  .xh-code {
    flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-family: var(--mono); font-size: 12px; color: var(--text2); user-select: all;
  }
  .xh-code.empty { color: var(--text3); user-select: none; }

  /* Binds */
  .keys { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
  kbd {
    font-family: var(--mono); font-size: 11px; color: var(--text2);
    background: var(--surface2); border: 1px solid var(--border2); border-radius: 4px; padding: 2px 7px;
  }

  /* Console blocks and copy */
  .copy {
    font-family: var(--mono); font-size: 11px; color: var(--text2); cursor: pointer; white-space: nowrap;
    background: var(--surface2); border: 1px solid var(--border2); border-radius: 4px; padding: 4px 10px;
    transition: color .12s, border-color .12s;
  }
  .copy:hover, .copy.is-done { color: var(--accent); border-color: var(--accent); }
  .consoles { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
  .console { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; min-width: 0; }
  .console-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--border); background: var(--surface2);
  }
  .console-head span { font-family: var(--mono); font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); }
  .console-body { padding: 10px 14px 12px; font-family: var(--mono); font-size: 12.5px; overflow-x: auto; }
  .cline { display: flex; gap: 12px; padding-block: 3px; white-space: nowrap; }
  .cline .k { color: var(--text3); }
  .file { max-height: 300px; overflow: auto; }
  details summary { cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--text3); }
  details summary:hover { color: var(--text2); }
  details[open] summary { margin-bottom: 8px; }
  .lead { margin: 0; color: var(--text2); max-width: 60ch; }

  .panel.anim { animation: panel-in .3s ease-out both; }

  /* Setup */
  .setup { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }

  footer {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding-block: 26px 64px; font-family: var(--mono); font-size: 11px; color: var(--text3);
  }

  @keyframes panel-in { from { opacity: 0.35; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  @media (max-width: 720px) {
    .sec { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 28px; }
    .rows.two, .setup { grid-template-columns: minmax(0, 1fr); }
    .jump { display: none; }
  }
  @media (max-width: 500px) {
    .hero { flex-direction: column; align-items: flex-start; padding-block: 48px 32px; gap: 18px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function copyText(text, btn, doneLabel) {
  const original = btn.dataset.label || btn.textContent;
  btn.dataset.label = original;
  const done = () => {
    btn.textContent = doneLabel || 'Copied';
    btn.classList.add('is-done');
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { btn.textContent = original; btn.classList.remove('is-done'); }, 1600);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    if (ok) done(); else { btn.textContent = 'Select and copy manually'; }
  };
  try {
    navigator.clipboard.writeText(text).then(done, fallback);
  } catch (e) { fallback(); }
}

/* Valorant crosshair codes: reads the primary crosshair ("P") part of a code.
   Defaults are Valorant's own; a code only lists what differs from them. */
const VAL_COLORS = ['#ffffff', '#00ff00', '#7fff00', '#dfff00', '#ffff00', '#00ffff', '#ff00ff', '#ff0000'];
function valorantSpec(code) {
  if (!code) return null;
  const t = String(code).trim().split(';');
  const v = {};
  let inP = false;
  for (let i = 0; i < t.length; i++) {
    if (t[i] === 'P') { inP = true; continue; }
    if (t[i] === 'A' || t[i] === 'S') { if (inP) break; continue; }
    if (inP && i + 1 < t.length) { v[t[i]] = t[i + 1]; i++; }
  }
  const n = (k, d) => (v[k] !== undefined && !isNaN(parseFloat(v[k]))) ? parseFloat(v[k]) : d;
  let color = VAL_COLORS[n('c', 0)] || '#ffffff';
  if (n('c', 0) === 8 && v.u) color = '#' + v.u.slice(0, 6);
  const line = (p, d) => n(p + 'b', d.on) ? {
    length: n(p + 'l', d.l), vlength: n(p + 'g', 0) ? n(p + 'v', n(p + 'l', d.l)) : n(p + 'l', d.l), thickness: n(p + 't', d.t),
    gap: n(p + 'o', d.o) + n(p + 't', d.t) / 2, opacity: n(p + 'a', d.a)
  } : null;
  return {
    color,
    outline: n('h', 1) ? { thickness: n('t', 1), opacity: n('o', 0.5) } : null,
    dot: n('d', 0) ? { size: n('z', 2), opacity: n('a', 1) } : null,
    inner: line('0', { on: 1, l: 6, t: 2, o: 3, a: 0.8 }),
    outer: line('1', { on: 1, l: 2, t: 2, o: 10, a: 0.35 })
  };
}

/* Draws a crosshair at true size: one in-game pixel per screen pixel. */
function drawCrosshair(canvas, spec) {
  const dpr = window.devicePixelRatio || 1;
  const W = Math.round((canvas.clientWidth || 44) * dpr), H = Math.round((canvas.clientHeight || 44) * dpr);
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (!spec) return;
  const cx = Math.floor(W / 2), cy = Math.floor(H / 2);
  const bars = [];
  [spec.inner, spec.outer].forEach(l => {
    if (!l || l.thickness <= 0 || l.opacity <= 0) return;
    const T = l.thickness, L = l.length, V = l.vlength === undefined ? l.length : l.vlength, g = l.gap;
    if (L > 0) bars.push([-g - L, -T / 2, L, T, l.opacity], [g, -T / 2, L, T, l.opacity]);
    if (V > 0) bars.push([-T / 2, -g - V, T, V, l.opacity], [-T / 2, g, T, V, l.opacity]);
  });
  if (spec.dot && spec.dot.size > 0) { const d = spec.dot.size; bars.push([-d / 2, -d / 2, d, d, spec.dot.opacity]); }
  const px = b => [Math.round(cx + b[0]), Math.round(cy + b[1]), Math.max(1, Math.round(b[2])), Math.max(1, Math.round(b[3]))];
  if (spec.outline && spec.outline.thickness > 0) {
    const o = Math.max(1, Math.round(spec.outline.thickness));
    ctx.fillStyle = '#000'; ctx.globalAlpha = spec.outline.opacity;
    bars.forEach(b => { const r = px(b); ctx.fillRect(r[0] - o, r[1] - o, r[2] + o * 2, r[3] + o * 2); });
  }
  ctx.fillStyle = spec.color;
  bars.forEach(b => { const r = px(b); ctx.globalAlpha = b[4]; ctx.fillRect(r[0], r[1], r[2], r[3]); });
  ctx.globalAlpha = 1;
}

function initialGame() {
  const h = (location.hash || '').replace('#', '').toLowerCase();
  return SITE.order.includes(h) ? h : SITE.order[0];
}


(function () {
  const $ = id => document.getElementById(id);

  $('links').innerHTML = SITE.links.map(l => {
    const icon = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[l.id] + '</svg>';
    if (l.copy) return '<button class="chip" type="button" data-copy="' + esc(l.copy) + '" title="Copy Discord username" aria-label="Copy Discord username ' + esc(l.copy) + '">' + icon + '<span>' + esc(l.label) + '</span></button>';
    return '<a class="chip" href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer">' + icon + esc(l.label) + '</a>';
  }).join('');
  $('links').addEventListener('click', e => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    copyText(b.dataset.copy, b.querySelector('span'), 'copied');
    b.classList.add('is-done'); setTimeout(() => b.classList.remove('is-done'), 1600);
  });

  const rows = list => list.map(r => '<div class="row"><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>').join('');
  $('gear').innerHTML = rows(SITE.gear);
  $('specs').innerHTML = rows(SITE.specs);
  $('domain').textContent = SITE.domain;
  $('updated').textContent = 'last updated ' + SITE.updated;

  $('games').innerHTML = SITE.order.map(id =>
    '<button class="game" role="tab" type="button" id="tab-' + id + '" data-game="' + id + '" aria-controls="panel">' + esc(SITE.games[id].name) + '</button>').join('');

  function section(s) {
    let body = '';
    if (s.type === 'mouse') {
      body = '<dl class="stats">' + s.stats.map(x =>
        '<div class="stat' + (x.accent ? ' accent' : '') + '"><dt>' + esc(x.k) + '</dt><dd>' + esc(x.v) + '</dd></div>').join('') + '</dl>';
    } else if (s.type === 'crosshair') {
      const many = s.items.length > 1;
      body = '<div class="xh-pick"><div class="xh-tiles" role="radiogroup" aria-label="Crosshairs">' + s.items.map((x, i) =>
        '<button class="xh-tile" type="button" role="radio" data-pick="' + i + '" aria-checked="' + (i === 0) + '" tabindex="' + (i === 0 ? 0 : -1) + '" aria-label="Crosshair ' + esc(x.name) + '">' +
        '<canvas data-xh="' + i + '" aria-hidden="true"></canvas>' + (many ? '<span class="n" aria-hidden="true">' + esc(x.name) + '</span>' : '') + '</button>').join('') +
        '</div><div class="xh-bar"><code class="xh-code" id="xh-code"></code><button class="copy" type="button" id="xh-copy">copy</button></div></div>';
    } else if (s.type === 'groups') {
      body = s.groups.map(g => '<div>' + (g.title ? '<p class="label">' + esc(g.title) + '</p>' : '') + '<dl class="rows two">' + rows(g.rows) + '</dl></div>').join('');
    } else if (s.type === 'binds') {
      body = '<dl class="rows two">' + s.rows.map(r =>
        '<div class="row"><dt>' + esc(r[0]) + '</dt><dd><span class="keys">' + r[1].map(k => '<kbd>' + esc(k) + '</kbd>').join('') + '</span></dd></div>').join('') + '</dl>';
    } else if (s.type === 'console') {
      body = '<div class="consoles">' + s.blocks.map(b => {
        const text = b.lines.map(l => l[0] + ' ' + l[1]).join(';');
        return '<div class="console"><div class="console-head"><span>' + esc(b.title) + '</span><button class="copy" type="button" data-copy="' + esc(text) + '">copy</button></div>' +
          '<div class="console-body">' + b.lines.map(l => '<div class="cline"><span class="k">' + esc(l[0]) + '</span><span>' + esc(l[1]) + '</span></div>').join('') + '</div></div>';
      }).join('') + '</div>';
    } else if (s.type === 'autoexec') {
      const text = s.lines.join('\n');
      body = '<div class="console"><div class="console-head"><span>' + esc(s.file) + '</span><button class="copy" type="button" data-copy="' + esc(text) + '">copy file</button></div>' +
        '<details class="console-body"><summary>show all ' + s.lines.length + ' lines</summary><div class="file">' +
        s.lines.map(l => '<div class="cline"><span>' + esc(l) + '</span></div>').join('') + '</div></details></div>';
    }
    return '<section class="sec" id="sec-' + s.id + '" aria-labelledby="h-' + s.id + '"><h2 id="h-' + s.id + '">' + esc(s.title) + '</h2><div class="sec-body">' + body + '</div></section>';
  }

  let current = null;
  function pick(xs, i) {
    const x = xs.items[i];
    document.querySelectorAll('.xh-tile').forEach(t => {
      const on = Number(t.dataset.pick) === i;
      t.setAttribute('aria-checked', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1;
    });
    const code = $('xh-code'), btn = $('xh-copy');
    code.textContent = x.code || 'code coming soon';
    code.title = x.code || '';
    code.classList.toggle('empty', !x.code);
    btn.hidden = !x.code;
    if (x.code) btn.dataset.copy = x.code;
  }

  function show(id, animate) {
    const g = SITE.games[id];
    document.querySelectorAll('.game').forEach(b => {
      const on = b.dataset.game === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
    });
    const panel = $('panel');
    panel.setAttribute('aria-labelledby', 'tab-' + id);
    panel.innerHTML = g.sections.map(section).join('');
    if (animate) { panel.classList.remove('anim'); void panel.offsetWidth; panel.classList.add('anim'); }
    $('jump').innerHTML = g.sections.map(s => '<button type="button" data-to="sec-' + s.id + '">' + esc(s.title.toLowerCase()) + '</button>').join('') +
      '<button type="button" data-to="sec-setup">setup</button>';
    const xs = g.sections.find(s => s.type === 'crosshair');
    if (xs) {
      xs.items.forEach((x, i) => {
        const c = panel.querySelector('[data-xh="' + i + '"]');
        if (c) drawCrosshair(c, x.spec || (id === 'valorant' ? valorantSpec(x.code) : null));
      });
      pick(xs, 0);
    }
    current = xs;
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  $('games').addEventListener('click', e => {
    const b = e.target.closest('.game');
    if (!b || b.getAttribute('aria-selected') === 'true') return;
    show(b.dataset.game, true);
    const bar = document.querySelector('.bar');
    if (bar.getBoundingClientRect().top <= 1) window.scrollTo({ top: bar.offsetTop, behavior: 'auto' });
  });
  $('games').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const ids = SITE.order, cur = ids.indexOf(document.querySelector('.game[aria-selected="true"]').dataset.game);
    const next = ids[(cur + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length];
    show(next, true); $('tab-' + next).focus();
  });
  $('panel').addEventListener('click', e => {
    const t = e.target.closest('[data-pick]');
    if (t && current) pick(current, Number(t.dataset.pick));
  });
  $('panel').addEventListener('keydown', e => {
    const t = e.target.closest('[data-pick]');
    if (!t || !current || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    e.preventDefault();
    const n = current.items.length, i = (Number(t.dataset.pick) + (e.key === 'ArrowRight' ? 1 : n - 1)) % n;
    pick(current, i); document.querySelector('[data-pick="' + i + '"]').focus();
  });
  $('jump').addEventListener('click', e => {
    const b = e.target.closest('[data-to]');
    if (b) document.getElementById(b.dataset.to).scrollIntoView({ block: 'start' });
  });
  document.addEventListener('click', e => {
    const b = e.target.closest('.copy[data-copy]');
    if (b) copyText(b.dataset.copy, b, 'copied');
  });

  show(initialGame(), false);
})();
</script>
